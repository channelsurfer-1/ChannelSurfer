name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run package
            files: dist/*.dmg
          - platform: Windows
            os: windows-latest
            script: npm run package:win
            files: dist/*.zip
          - platform: Linux
            os: ubuntu-latest
            script: npm run package:linux
            files: dist/*.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        run: ${{ matrix.script }}

      - name: Publish to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true