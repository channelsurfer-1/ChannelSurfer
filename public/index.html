<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: app: data:; connect-src 'self' file:;">
  <title>ChannelSurfer</title>
  <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>
  <div id="top-bar">
    <div id="top-bar-left">
      <img src="app://icon-32.png" alt="" class="app-icon">
      <span id="app-title">ChannelSurfer</span>
    </div>

    <div id="top-bar-right">
    </div>
  </div>

  <div id="view-layout">
    <!-- Panes area -->
    <div id="panes-container" class="panes-1">
      <div class="view-pane" data-pane="0"></div>
      <div class="view-pane" data-pane="1"></div>
      <div class="view-pane" data-pane="2"></div>
      <div class="view-pane" data-pane="3"></div>
    </div>
  </div>

  <button id="add-view-btn" title="Add a view">+</button>

  <div id="tooltip"></div>
  <script src="app.js"></script>
</body>
</html>
